<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>PayHug Admin — 화면명</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
</head>
<!--
  ★ 사용법: 이 파일을 payhug-investor-admin/ 루트에 <화면명>.html 로 복사해 시작한다.
    (assets/base.css · assets/logo-icon.png 상대경로가 루트 기준 — assets/ 안에서 열면 스타일이 깨진다)
  활성 메뉴 지정: body data-active 에 메뉴 ID를 넣으면 해당 메뉴·그룹이 하이라이트된다.
  메뉴 ID: invest-assets | invest-returns | merchants | receivables | contracts | kcoon | password
-->
<body data-active="invest-assets">
<div class="page">

  <!-- ═══════════ 사이드바 (수정 금지 — 화면마다 동일) ═══════════ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="#">
        <span class="logo-mark" role="img" aria-label="PayHug"></span>
        <span class="wordmark">PayHug <em>Admin</em></span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group" data-group="invest">
        <div class="nav-group-label">
          <span>투자</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <a class="nav-item" data-menu="invest-assets" href="invest-assets.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 10h18M7 15h1m4 0h1m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>투자 자산</span>
        </a>
        <a class="nav-item" data-menu="invest-returns" href="invest-profit.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
          <span>투자 수익</span>
        </a>
      </div>

      <div class="nav-group" data-group="merchant">
        <div class="nav-group-label">
          <span>가맹점</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <a class="nav-item" data-menu="merchants" href="merchants.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>가맹점</span>
        </a>
        <a class="nav-item" data-menu="receivables" href="acquisition.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span>정산채권 양수</span>
        </a>
        <a class="nav-item" data-menu="contracts" href="contracts.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>계약기록</span>
        </a>
      </div>

      <div class="nav-group" data-group="manage">
        <div class="nav-group-label">
          <span>관리</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <a class="nav-item" data-menu="kcoon" href="coocon.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>쿠콘 관리 현금</span>
          <svg class="ext" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
        <a class="nav-item" data-menu="password" href="password.html">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span>비밀번호 변경</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-profile">
      <div class="avatar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </div>
      <div class="info">
        <p class="name">㈜테스트인베스트</p>
        <button class="logout">로그아웃</button>
      </div>
    </div>
  </aside>

  <!-- ═══════════ 콘텐츠 영역 ═══════════ -->
  <main class="content">
    <div class="page-header">
      <h1 class="page-title">화면 제목</h1>
      <p class="page-sub">화면 설명 한 줄.</p>
    </div>

    <!-- CONTENT -->

  </main>

</div>
</body>
</html>
