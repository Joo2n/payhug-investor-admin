<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>투자자 어드민 — 순차 확인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--card:#fff;--ln:#e5e7eb;--tx:#111827;--sub:#6b7280;--pri:#4da119;--pri50:#f4fdf0;--warn:#b45309;--warn50:#fffbeb;--bad:#b91c1c;--bad50:#fef2f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:14px;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:36px 24px 80px}
h1{font-size:22px;margin:0}
.lead{color:var(--sub);margin:6px 0 0;font-size:13px}
.pbar{height:6px;background:var(--ln);border-radius:20px;overflow:hidden;margin:22px 0 6px}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:20px;transition:width .25s}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:26px 28px}
.stepno{font-size:11px;font-weight:700;color:var(--pri);letter-spacing:.08em}
h2{font-size:19px;margin:6px 0 0}
.what{color:var(--sub);margin:8px 0 0}
.kind{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;margin-top:12px}
.k-ok{background:var(--pri50);color:var(--pri)}
.k-warn{background:var(--warn50);color:var(--warn)}
.k-bad{background:var(--bad50);color:var(--bad)}
.open{display:inline-flex;align-items:center;gap:7px;margin:18px 0 0;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;font-size:13px;border-radius:9px;padding:11px 20px}
.open:hover{background:#3a7a15}
.open.ghost{background:#fff;color:var(--tx);border:1px solid var(--ln)}
.open.ghost:hover{background:#f9fafb}
h3{font-size:13px;margin:26px 0 8px;color:var(--sub);font-weight:500}
ul{margin:0;padding-left:18px}
li{margin:5px 0}
.note{background:#f9fafb;border-left:3px solid var(--ln);padding:11px 15px;margin-top:18px;font-size:13px;color:#374151;border-radius:0 8px 8px 0}
.note.warn{background:var(--warn50);border-left-color:#f59e0b}
.note.bad{background:var(--bad50);border-left-color:#dc2626}
.nav{display:flex;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--ln);flex-wrap:wrap}
button{font-family:inherit;font-size:13px;font-weight:700;border-radius:9px;padding:11px 20px;border:1px solid var(--ln);background:#fff;color:var(--tx);cursor:pointer}
button:hover{background:#f9fafb}
button.ok{background:var(--pri);border-color:var(--pri);color:#fff}
button.ok:hover{background:#3a7a15}
button.hold{background:var(--warn50);border-color:#fcd34d;color:var(--warn)}
button:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:26px}
.dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:#fff;font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.dot.cur{border-color:var(--pri);color:var(--pri)}
.dot.done{background:var(--pri);border-color:var(--pri);color:#fff}
.dot.held{background:var(--warn50);border-color:#fcd34d;color:var(--warn)}
.foot{margin-top:26px;font-size:12px;color:var(--sub);text-align:center}
.foot a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
  <h1>투자자 어드민 — 순차 확인</h1>
  <p class="lead">확인했으면 <b>확인</b>, 이상하면 <b>보류</b>.</p>

  <div class="pbar"><i id="bar"></i></div>
  <div class="pmeta"><span id="pcount"></span><span id="pheld"></span></div>

  <div class="card" id="card"></div>
  <div class="dots" id="dots"></div>

  <p class="foot">
    전체 파일 목록은 <a href="archive.html">작업물 아카이브</a>.
    원고·분석 문서는 레포 밖 <code>_pipeline/investor_admin/</code> 에 있다.
  </p>
</div>

<script>
const CNT = {menus:8, screens:15, states:21, appStates:20, xlsx:8};
const STEPS = [
 {t:"통합 프로토타입이 무엇인가", kind:"ok", kl:"동작함",
  what:"메뉴·버튼이 실제로 눌리는 단 하나의 파일. 시연은 전부 여기서 한다.",
  href:"app.html", label:"통합 프로토타입 열기",
  check:["왼쪽 메뉴 "+CNT.menus+"개를 눌러 화면이 바뀌는지","기간 프리셋이 먹는지","일별·주별·월별 토글이 먹는지"],
  note:{k:"", v:"화면 "+CNT.screens+"개·상태 "+CNT.appStates+"개가 전부 이 파일 안에서 조작으로 이어진다. 상태 낱장은 "+CNT.states+"개이고, 투자 수익의 시작일 달력 팝오버 열림은 Figma 임포트용 낱장으로만 둔다."}},

 {t:"정적 화면은 왜 안 움직이나", kind:"warn", kl:"설계상 정상",
  what:"화면 한 장을 그대로 굳혀 놓은 스냅샷. Figma로 넘기기 위한 것이라 JS가 없다.",
  href:"merchants.html", label:"가맹점 정적 화면 열기",
  check:["필터·검색이 눌리지 않는 것을 확인","같은 화면을 통합 프로토타입에서 열면 동작하는 것과 대조"],
  note:{k:"warn", v:"여기서 기능이 안 되는 건 결함이 아니다. 기능 확인은 항상 통합 프로토타입에서 한다. 1 프레임 = 1 화면이어야 Figma 임포트가 성립한다."}},

 {t:"검색이 실제로 도는지", kind:"ok", kl:"동작함",
  what:"가맹점 화면에서 검색어를 넣으면 표가 실제로 걸러진다.",
  href:"app.html#merchants", label:"가맹점 화면 열기",
  check:["검색어에 '김성호' 입력 후 검색 → 16건이 1건으로","적용된 조건 칩이 뜨는지","초기화를 누르면 16건으로 복귀"],
  note:{k:"", v:"검색어는 가맹점ID·상호·사업자번호·대표자명·종목 5개 열을 훑는다. 토스트·조건칩·페이지네이션이 함께 움직인다."}},

 {t:"업종 필터 — 네이티브 select", kind:"ok", kl:"원본 방식",
  what:"업종 드롭다운은 통합본·정적 화면 모두 네이티브 select다. 눌러보면 열리고 표가 걸러진다.",
  href:"app.html#merchants", label:"직접 눌러보기",
  check:["업종 드롭다운을 눌러 목록이 열리고 표가 걸러지는지","키보드 Tab으로도 닿는지","가맹점 정적 화면의 같은 필터와 생김새가 같은지"],
  note:{k:"", v:"실제 어드민에는 커스텀 드롭다운이 0건이고 전부 네이티브 select다. 옵션 목록은 원장에 실재하는 업종만 담는다 — 운영 어드민에 업종 필터 자체가 없어 가져올 코드 목록이 없다. 업종 필터를 유지할지, 유지하면 코드 목록을 어디서 받을지는 대표 확인 요청 부록 D-12로 열려 있다."}},

 {t:"엑셀은 실물이 내려온다", kind:"ok", kl:"실물 있음",
  what:"화면 재현이 아니라 진짜 .xlsx 파일 4개.",
  href:"assets/xlsx/투자자산현황_2026-08-27_2026-08-27.xlsx", label:"엑셀 하나 받아보기",
  check:["파일이 실제로 열리는지","시트 헤더가 화면 표와 같은지","통합 프로토타입에서 엑셀 다운로드 버튼을 눌러도 같은 파일이 오는지"],
  note:{k:"", v:"투자자산 현황 · 가맹점별 투자자산 · 투자수익 현황 · 일별/주별/월별 투자수익 "+CNT.xlsx+"종. 다운로드 버튼이 내려주는 파일과 바이트가 같다."}},

 {t:"계약서·증명서도 실물", kind:"ok", kl:"실물 있음",
  what:"계약서 원문과 전자서명 결과는 텍스트로, 증명서는 PDF로 걸려 있다.",
  href:"archive.html#todo", label:"문서 목록 보기",
  check:["재양도합의서 텍스트가 열리는지","견본 표기가 본문에 있는지","서명란이 빈칸인지"],
  note:{k:"warn", v:"계약서도 텍스트, 서명값도 텍스트라 전자서명 결과에 PDF 이미지를 쓰지 않는다. 증명서 PDF와 묶음 zip 2개는 그대로 있고, 견본 표기와 공란 수수료율로 실제 계약 효력이 있는 문서로 오인될 여지를 막는다."}},

 {t:"용어 해설", kind:"ok", kl:"최신 · 용어 50건",
  what:"화면과 엑셀에 쓰인 계산식 용어 50건.",
  href:"glossary.html", label:"용어 해설 열기",
  check:["왼쪽 목차가 용어 50건 목록인지 (서술 목차가 아니라)","카드 하나를 골라 변수·계산식·화면 위치·관련 용어가 채워져 있는지","화면 캡처의 초록 상자가 그 용어가 실제로 뜨는 칸을 가리키는지","캡처를 눌러 확대되고 Esc로 닫히는지","변수 칸의 기호를 눌러 부록 A 기호 사전으로 가는지","관련 용어의 이름을 눌러 그 카드로 넘어가는지"],
  note:{k:"", v:"기호가 붙은 용어는 22건이고 나머지 28건은 대표 정의 원문에 기호가 없다. 영문 약자의 머리글자는 원문에 근거가 없어 추측을 넣지 않았고, 원문에서 관찰되는 쓰임만 적었다. 한국어 이름은 원문이 붙인 것과 이 문서가 붙인 것을 갈라 표시한다. 서술 여섯 절은 부록 A~G로 내려가 있다."}},

 {t:"대표님께 보낼 문의서", kind:"ok", kl:"복사 준비됨",
  what:"대표님 정의와 현행 화면 사이에서 값이 안 맞거나 참조가 끊기는 지점.",
  href:"inquiry.html", label:"대표 확인 요청 열기",
  check:["대표 문항이 4건인지","버튼 하나로 전문이 복사되는지","개발 확인 항목이 따로 갈려 있는지"],
  note:{k:"", v:"대표 문항 Q-1~Q-4 4건. 번호 마커·채권매입수수료·미지급금/과지급금 3건은 사내 대조로 닫혀 부록 §7에 있다. 본문 4건은 표기·선택 문제라 개발 착수를 막지 않는다. 개발·백엔드 부록은 30건(선결 병목 2 · 신설 목록 12 · 데이터·화면·표기 16)이고 대표님께 보내는 본문에는 들어가지 않는다."}},

 {t:"투자자에게 무엇을 보여주는가", kind:"ok", kl:"현행 명세",
  what:"화면별로 투자자가 할 수 있는 행위와, 그 값이 페이허그 어디서 나오는지.",
  href:"capability.html", label:"기능·데이터 명세 열기",
  check:["노출 불가·주의 항목이 사유와 함께 적혀 있는지","개발 확인 질문을 복사할 수 있는지"],
  note:{k:"", v:"투자자 행위 35건 · 데이터 49항목 · 노출 불가 11건 · 미구현 23건."}},

 {t:"숫자가 서로 맞는가", kind:"ok", kl:"5자 대조",
  what:"화면·통합본·엑셀이 같은 가맹점에 대해 같은 숫자를 말해야 한다.",
  href:"app.html", label:"투자 자산 화면 열기",
  check:["비중 합계가 100.0%로 닫히는지","페이지를 넘겨도 100.0%가 유지되는지","투자 수익 현황의 투자자산 대비 Ty수익율이 10.72%인지","기간 프리셋을 바꿨을 때 표 행수와 카드 합계가 함께 따라가는지","같은 기간을 일별·주별·월별로 번갈아 봐도 카드 값이 같은지","같은 값이 엑셀에도 있는지"],
  note:{k:"", v:"정적 화면 ↔ 통합 프로토타입 ↔ 엑셀 23건 일치, 불일치 0. 일별 원장 180일 전건이 할인율 0.11% 한 값에서 나오고, 주별·월별 표는 그 원장을 조회 기간만큼 잘라 버킷으로 합친 것이다. 기본 조회 기간에는 7행이 보인다."}},

 {t:"아직 열려 있는 것", kind:"warn", kl:"판단·회신 대기",
  what:"산출물 안에서 닫을 수 없고 판단이나 회신이 와야 닫히는 자리.",
  href:"archive.html#todo", label:"작업 목록 보기",
  check:["작업 목록에서 대기·결정 대기 항목이 무엇인지 훑어보기","대기 항목의 산출 열이 무엇을 가리키는지 확인"],
  note:{k:"warn", v:"남은 문항은 4건이고 전부 표기·선택 문제다. 차감항(미지급금·과지급금)은 어드민에 실재하는 값으로 확정돼 문항에서 빠졌고, 남은 일은 그 값을 채권 1건에 귀속시키는 경로다. 할인율 0.11%는 이 산출물의 고정 입력값이고, 정책서 쪽 수수료율 C1은 별도로 열려 있다."}}
];

const KEY="ph_review_v1";
let st = {}; try{ st = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ st={}; }
let cur = st.cur||0;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const s = STEPS[cur];
  const mark = (st.marks||{})[cur];
  const kc = s.kind==="ok"?"k-ok":s.kind==="bad"?"k-bad":"k-warn";
  document.getElementById("card").innerHTML =
    '<div class="stepno">STEP '+(cur+1)+' / '+STEPS.length+'</div>'+
    '<h2>'+esc(s.t)+'</h2>'+
    '<p class="what">'+esc(s.what)+'</p>'+
    '<span class="kind '+kc+'">'+esc(s.kl)+'</span><br>'+
    '<a class="open'+(s.kind==="bad"?" ghost":"")+'" href="'+s.href+'" target="_blank">'+esc(s.label)+' &rarr;</a>'+
    '<h3>확인할 것</h3><ul>'+s.check.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ul>'+
    (s.note?'<div class="note '+(s.note.k||"")+'">'+esc(s.note.v)+'</div>':"")+
    '<div class="nav">'+
      '<button id="prev"'+(cur===0?" disabled":"")+'>이전</button>'+
      '<button class="ok" id="ok">'+(mark==="ok"?"확인함":"확인")+'</button>'+
      '<button class="hold" id="hold">'+(mark==="hold"?"보류함":"보류")+'</button>'+
      '<span class="spacer"></span>'+
      '<button id="next"'+(cur===STEPS.length-1?" disabled":"")+'>다음</button>'+
    '</div>';

  document.getElementById("prev").onclick=()=>{ if(cur>0){cur--; st.cur=cur; save(); render();} };
  document.getElementById("next").onclick=()=>{ if(cur<STEPS.length-1){cur++; st.cur=cur; save(); render();} };
  document.getElementById("ok").onclick=()=>mark_it("ok");
  document.getElementById("hold").onclick=()=>mark_it("hold");

  const marks = st.marks||{};
  const done = Object.values(marks).filter(v=>v==="ok").length;
  const held = Object.values(marks).filter(v=>v==="hold").length;
  document.getElementById("bar").style.width = (done/STEPS.length*100)+"%";
  document.getElementById("pcount").textContent = done+" / "+STEPS.length+" 확인";
  document.getElementById("pheld").textContent = held?("보류 "+held+"건"):"";

  document.getElementById("dots").innerHTML = STEPS.map((_,i)=>{
    const m=marks[i]; const c=["dot"];
    if(i===cur)c.push("cur"); if(m==="ok")c.push("done"); if(m==="hold")c.push("held");
    return '<div class="'+c.join(" ")+'" data-i="'+i+'">'+(i+1)+'</div>';
  }).join("");
  [...document.querySelectorAll(".dot")].forEach(d=>d.onclick=()=>{ cur=+d.dataset.i; st.cur=cur; save(); render(); });
}

function mark_it(v){
  st.marks = st.marks||{};
  st.marks[cur] = (st.marks[cur]===v)? null : v;
  save();
  if(st.marks[cur]==="ok" && cur<STEPS.length-1){ cur++; st.cur=cur; }
  render();
}

render();
</script>
</body>
</html>
