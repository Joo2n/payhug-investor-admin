# 배포 동기화 검사
#
#   payhug-investor-admin/app.html      ──변환──▶  payhug-investor-prototype/index.html
#   payhug-investor-admin/glossary.html ──변환──▶  payhug-investor-glossary/index.html
#
# 이 워크플로는 다른 저장소에 push 하지 않는다. 원본에서 다시 찍어 낸 결과와
# 두 대상 저장소에 실제로 올라가 있는 index.html 이 같은지만 본다.
#
# push 를 하려면 대상 저장소에 contents:write 가 있는 PAT 이 필요한데, 기본 GITHUB_TOKEN 은
# 이 저장소 밖으로 쓸 수 없다. 그 PAT 이 등록되지 않은 채로 push 단계가 남아 있어
# 2026-08-28 이후 모든 실행이 3초 만에 실패했다. 검사만 하는 형태는 토큰이 필요 없다 —
# 세 저장소가 모두 public 이라 인증 없이 읽을 수 있다.
#
# 반영은 로컬에서 한다.
#   payhug-spec/_pipeline/investor_admin/sync_prototype.sh
#   payhug-spec/_pipeline/investor_admin/sync_glossary.sh
#
# 이 검사가 실패하면 두 대상 저장소 중 하나가 원본보다 뒤처져 있다는 뜻이다.

name: 배포 동기화 검사

on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'glossary.html'
      - 'assets/**'
      - 'scripts/sync_prototype.py'
      - 'scripts/sync_glossary.py'
      - '.github/workflows/sync-prototype.yml'
  workflow_dispatch:

concurrency:
  group: sync-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PROTO_REPO: Joo2n/payhug-investor-prototype
      GLOSS_REPO: Joo2n/payhug-investor-glossary
      PROTO_URL:  https://payhug-investor-prototype.vercel.app/
      GLOSS_URL:  https://payhug-investor-glossary.vercel.app/
      RETRY:      32          # 15초 간격 — 로컬 push 가 뒤따라 오는 시간을 준다
      GAP:        15

    steps:
      - name: 원본 저장소 체크아웃
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 원본에서 두 산출물을 다시 찍어 낸다
        run: |
          set -e
          mkdir -p _expect/proto _expect/gloss
          python3 scripts/sync_prototype.py --dst _expect/proto
          python3 scripts/sync_glossary.py  --dst _expect/gloss
          echo "프로토타입 $(wc -c < _expect/proto/index.html) bytes"
          echo "용어       $(wc -c < _expect/gloss/index.html) bytes"

      - name: 통로 잔존 검사 (변환 스크립트와 독립)
        run: |
          # GitHub 은 run 을 `bash -e` 로 돌린다. grep 은 못 찾으면 1 을 내는데
          # 이 검사에서 "못 찾음"은 통과다. pipefail 이 그 1 을 대입문까지 올리고
          # errexit 가 첫 단어에서 단계를 죽인다. 그래서 여기서는 둘 다 끈다.
          set -u
          set +e
          F=_expect/proto/index.html
          # 파일이 없으면 모든 grep 이 "못 찾음"이 돼 통과처럼 보인다. 먼저 막는다.
          if [ ! -s "$F" ]; then
            echo "::error title=기대 산출물 없음::$F 가 없거나 비었다"
            exit 1
          fi
          rc=0
          for w in glossary capability feasibility inquiry archive review 랜딩 갤러리 문의서; do
            n=$(grep -o -i -- "$w" "$F" | wc -l | tr -d ' ')
            if [ "$n" != "0" ]; then
              echo "::error title=금칙 문자열 잔존::$w x$n"
              rc=1
            fi
          done
          # 형제 문서 상대링크 — 해시·자산·자기 자신·외부 절대주소 외에는 없어야 한다
          if grep -oE 'href="[^"#]*"' "$F" \
             | grep -vE 'href="(https?:|mailto:|data:|assets/|index\.html)' | grep . ; then
            echo "::error title=형제 문서 상대링크 잔존::위 목록"
            rc=1
          fi
          # 허용 밖 외부 호스트
          if grep -oE '(href|src|action)="https?://[^/"]+' "$F" | sed -E 's/.*https?:\/\///' | sort -u \
             | grep -vE '^(fonts\.googleapis\.com|fonts\.gstatic\.com|www\.we-bank\.co\.kr)$' | grep . ; then
            echo "::error title=허용하지 않은 외부 호스트::위 목록"
            rc=1
          fi
          if [ "$rc" != "0" ]; then
            echo "바깥으로 나가는 통로가 남았다."
            exit 1
          fi
          echo "통로 잔존 0건"

      - name: 대상 저장소가 원본과 같은지 확인
        run: |
          set -u
          set +e
          rc=0
          check() {
            name=$1; repo=$2; want=$(sha256sum "$3" | cut -d' ' -f1)
            echo "── ${name}  기대 ${want}"
            for i in $(seq 1 "$RETRY"); do
              got=$(curl -fsSL \
                      -H "Accept: application/vnd.github.raw" \
                      "https://api.github.com/repos/${repo}/contents/index.html?ref=main" \
                    | sha256sum | cut -d' ' -f1 || echo "")
              if [ "$got" = "$want" ]; then
                echo "   같음 (${i}회차)"
                return 0
              fi
              sleep "$GAP"
            done
            echo "::error title=${name} 동기화 안 됨::${repo} 의 index.html 이 원본과 다르다. 마지막 관측 ${got}"
            return 1
          }
          check "프로토타입" "$PROTO_REPO" _expect/proto/index.html || rc=1
          check "용어"       "$GLOSS_REPO" _expect/gloss/index.html || rc=1
          if [ "$rc" != "0" ]; then
            echo ""
            echo "로컬에서 아래를 돌려 반영한다."
            echo "  payhug-spec/_pipeline/investor_admin/sync_prototype.sh"
            echo "  payhug-spec/_pipeline/investor_admin/sync_glossary.sh"
            exit 1
          fi
          echo "두 대상 저장소 모두 원본과 같다"

      - name: 배포면 응답 확인
        run: |
          set -u
          set +e
          rc=0
          for u in "$PROTO_URL" "$GLOSS_URL"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u" || echo "000")
            echo "${code}  ${u}"
            [ "$code" = "200" ] || rc=1
          done
          if [ "$rc" != "0" ]; then
            echo "::error title=배포면 응답 이상::200 이 아닌 주소가 있다"
            exit 1
          fi
